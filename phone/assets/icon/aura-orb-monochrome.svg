<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icône monochrome (icônes à thème d'Android 13+) : seule l'opacité compte, le système teinte. L'anneau passe devant la
       sphère avec un liseré vide de chaque côté pour rester lisible. -->
  <defs>
    <clipPath id="front"><rect x="0" y="512" width="1024" height="512"/></clipPath>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <g transform="rotate(-32 512 512)"><ellipse cx="512" cy="512" rx="300" ry="96" fill="none" stroke="#000" stroke-width="56" clip-path="url(#front)"/></g>
    </mask>
  </defs>
  <g fill="#fff">
    <circle cx="512" cy="512" r="196" mask="url(#cut)"/>
    <g transform="rotate(-32 512 512)"><ellipse cx="512" cy="512" rx="300" ry="96" fill="none" stroke="#fff" stroke-width="24"/></g>
  </g>
</svg>
